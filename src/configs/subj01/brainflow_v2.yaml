data:
  root: Data/nsd
  subject: subj01
  image_size: 224

model:
  n_voxels: 15724
  patch_size: 124
  hidden_dim: 512
  depth: 12
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.1
  drop_path_rate: 0.1
  # Representation Encoder
  encoder_name: vit_small_patch14_dinov2
  encoder_dim: 384
  encoder_pretrained: true
  cond_dim: 512
  use_cross_attention: true

training:
  batch_size: 64
  lr: 0.0003
  encoder_lr: 0.00003     # 10x smaller for pretrained encoder
  num_epochs: 500
  warmup_epochs: 20
  freeze_encoder_epochs: 0  # set >0 to freeze encoder for N epochs
  grad_clip: 1.0
  weight_decay: 0.05
  ema_decay: 0.999
  use_ema: true
  eval_interval: 5
  patience: 40
  save_every: 50

  # Flow matching
  use_ot: true
  sigma: 0.05
  timestep_sampling: logit_normal
  logit_normal_mu: 0.0
  logit_normal_sigma: 1.0

  # DGS (Dynamic Guidance Switching)
  cfg_drop_prob: 0.05
  cfg_scale: 1.0

  # Sampling
  ode_steps: 50
  num_trials: 1
  sampler: ode

  # Velocity loss
  velocity_loss_type: pseudo_huber
  huber_c: 0.1
  timestep_weight_type: cosine

output_dir: results/subj01/brainflow_v2
