data:
  root: Data/nsd
  subject: subj01
  dino_suffix: dinov2_vitb14_multilayer

dino_layers: [3, 6, 9, 12]

model:
  n_voxels: 15724
  patch_size: 124
  hidden_dim: 512
  depth: 12
  num_heads: 8
  context_dim: 768
  n_dino_layers: 4
  n_context_queries: 257
  mlp_ratio: 4.0
  dropout: 0.1
  drop_path_rate: 0.1

training:
  batch_size: 128
  lr: 0.0003
  num_epochs: 500
  warmup_epochs: 20
  grad_clip: 1.0
  weight_decay: 0.05
  ema_decay: 0.999
  use_ema: true
  eval_interval: 5
  patience: 40
  save_every: 50

  # Flow matching
  use_ot: true
  sigma: 0.05
  timestep_sampling: logit_normal
  logit_normal_mu: 0.0
  logit_normal_sigma: 1.0

  # DGS (Dynamic Guidance Switching) — FlowFM exact: 50% mask
  cfg_drop_prob: 0.5
  cfg_scale: 1.0
  context_mask_ratio: 0.0

  # Sampling
  ode_steps: 50
  num_trials: 1
  sampler: ode

  # Velocity loss
  velocity_loss_type: pseudo_huber
  huber_c: 0.1
  timestep_weight_type: cosine

output_dir: results/subj01/brainflow
