# Stage 2: Cross-Attention Flow Matching + Self-Conditioning — Subject 07 (ViT VAE)
data:
  root: "Data/nsd"
  subject: "subj07"
  vae_checkpoint: "results/subj07/stage1_vit_vae/best.pt"
  roi_dir: "Data/nsddata/ppdata/subj07/func1pt8mm/roi"
  dino_suffix: "dinov2_vitb14_multilayer"

dino_layers: [3, 6, 9, 12]

model:
  latent_dim: 768
  n_latent_tokens: 32
  context_dim: 768
  n_dino_layers: 4
  n_context_queries: 16
  hidden_dim: 384
  depth: 3
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.25
  drop_path_rate: 0.15
  use_self_cond: true

training:
  num_epochs: 150
  batch_size: 128
  lr: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_epochs: 10
  use_ema: true
  ema_decay: 0.999
  cfg_drop_prob: 0.15
  cfg_scale: 1.5
  sigma: 0.0
  ode_steps: 50
  num_trials: 1
  patience: 0
  save_every: 50
  eval_interval: 5

  # Self-conditioning
  self_cond_prob: 0.5

  # Multi-timestep consistency
  consistency_weight: 0.5

  # Flow only — no reconstruction loss
  flow_weight: 1.0

  # Noise-robust loss
  sigma_aug: 0.3
  huber_delta: 1.0
  use_snr_weights: true

  # Timestep sampling
  timestep_sampling: "uniform"

output_dir: "results/subj07/stage2_xattn_flow_vit_vae"
